name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**', 'feat/**']

concurrency:
  group: ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      smoke: ${{ steps.plan.outputs.smoke }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan from the trusted base
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          : > "$WORK/changed"
          : > "$WORK/deleted"
          PLANNER=scripts/ci_plan.py
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$WORK/changed"
            git diff --diff-filter=D --name-only "$BASE_SHA"...HEAD > "$WORK/deleted"
            mkdir "$WORK/trusted"
            git archive "$BASE_SHA" | tar -x -C "$WORK/trusted"
            if [ -f "$WORK/trusted/scripts/ci_plan.py" ]; then
              PLANNER="$WORK/trusted/scripts/ci_plan.py"
            else
              echo "Base has no planner; forcing the full suite with the candidate planner"
              EVENT=push
            fi
          fi
          if ! python3 -I "$PLANNER" --repo . --changed-file "$WORK/changed" \
              --deleted-file "$WORK/deleted" --event "$EVENT" > "$WORK/plan.json"; then
            echo "Planner failed; forcing the full suite"
            python3 -I "$PLANNER" --repo . --event push > "$WORK/plan.json"
          fi
          echo "CI plan (planner $PLANNER, base ${BASE_SHA:-none}):"
          cat "$WORK/plan.json"
          python3 -I - "$WORK/plan.json" "$EVENT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          if sys.argv[2] != "pull_request" and plan["mode"] != "full":
              sys.exit("a forced full plan must be mode full")
          if plan["mode"] == "full":
              planned = sorted(t for job in plan["jobs"] for t in job["tests"])
              if planned != sorted(p.as_posix() for p in pathlib.Path("tests").rglob("test_*.py")):
                  sys.exit("a full plan must run every test file exactly once")
          if plan["mode"] != "docs-only" and not plan["jobs"]:
              sys.exit("a plan that runs tests must have jobs")
          for job in plan["jobs"]:
              if not job["tests"] or any(not t.startswith("tests/") or not t.endswith(".py")
                                         or any(c.isspace() or c in "*?[" for c in t) for t in job["tests"]):
                  sys.exit(f"unsafe or empty test list in {job['name']}")
          print("jobs=" + json.dumps(plan["jobs"], separators=(",", ":")))
          print("smoke=" + ("true" if plan["smoke"] else "false"))
          print("mode=" + plan["mode"])
          PY

  guards:
    name: Essential safety guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Essential safety guards (always run)
        run: PYTHONPATH=tests:. PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests/test_bundle.py tests/test_cli_paths.py tests/test_evidence_integrity.py -v

  tests:
    name: ${{ matrix.job.name }}
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Unit tests
        env:
          TESTS: ${{ join(matrix.job.tests, ' ') }}
        run: |
          set -f
          PYTHONPATH=tests:. PYTHONDONTWRITEBYTECODE=1 python3 -m unittest $TESTS -v

  smoke:
    name: Smoke scripts
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Manual profile smoke
        run: bash scripts/smoke.sh

      - name: Native-turbo profile smoke
        run: bash scripts/smoke-turbo.sh

  ci:
    name: Unit tests and smoke scripts
    needs: [plan, guards, tests, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          GUARDS: ${{ needs.guards.result }}
          TESTS: ${{ needs.tests.result }}
          SMOKE: ${{ needs.smoke.result }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          echo "mode=$MODE plan=$PLAN guards=$GUARDS tests=$TESTS smoke=$SMOKE"
          [ "$PLAN" = success ] && [ "$GUARDS" = success ] || exit 1
          for result in "$TESTS" "$SMOKE"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
